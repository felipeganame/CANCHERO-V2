name: CI/CD Pipeline (QA & Production)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ==========================================
  # STAGE 1: Calidad, analisis estatico y tests unitarios/integracion
  # ==========================================
  quality-and-unit-tests:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/canchero_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: canchero_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm db:migrate
      - run: pnpm coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: SonarCloud quality gate
        if: ${{ vars.SONAR_ENABLED == 'true' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ==========================================
  # STAGE 2: Deploy a entorno de QA / Staging
  # ==========================================
  deploy-qa:
    name: Deploy to QA / Staging
    runs-on: ubuntu-latest
    needs: quality-and-unit-tests
    if: vars.VERCEL_ENABLED == 'true'
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    outputs:
      qa_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Migrate QA database (Drizzle)
        env:
          DATABASE_URL: ${{ secrets.QA_DATABASE_URL }}
        run: |
          for i in 1 2 3; do
            pnpm db:migrate && exit 0
            echo "Intento $i fallo, reintentando en 5s..."
            sleep 5
          done
          exit 1

      - name: Seed E2E accounts (QA)
        env:
          DATABASE_URL: ${{ secrets.QA_DATABASE_URL }}
          BETTER_AUTH_SECRET: ci-seed-only-not-used-for-sessions
          AUTH_TEST_LOGIN: "true"
        run: pnpm db:seed:e2e

      - name: Deploy preview build to Vercel (QA)
        id: deploy
        run: |
          url=$(npx vercel deploy --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

  # ==========================================
  # STAGE 3: E2E, Smoke & Stress sobre el entorno de QA
  # ==========================================
  qa-verification:
    name: Verification on QA (Smoke, E2E & Stress)
    runs-on: ubuntu-latest
    needs: deploy-qa
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Smoke tests against QA
        env:
          BASE_URL: ${{ needs.deploy-qa.outputs.qa_url }}
        run: pnpm test:smoke

      - name: E2E tests against QA
        env:
          BASE_URL: ${{ needs.deploy-qa.outputs.qa_url }}
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-e2e-report
          path: playwright-report/

      - uses: grafana/setup-k6-action@v1
      - name: Stress test against QA
        env:
          BASE_URL: ${{ needs.deploy-qa.outputs.qa_url }}
        run: k6 run tests/load/search.js

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-qa-summary
          path: summary.json
          if-no-files-found: ignore

  # ==========================================
  # STAGE 4: Deploy a produccion & smoke post-deploy
  # ==========================================
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: qa-verification
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.VERCEL_ENABLED == 'true'
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    outputs:
      prod_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Migrate production database (Drizzle)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          for i in 1 2 3; do
            pnpm db:migrate && exit 0
            echo "Intento $i fallo, reintentando en 5s..."
            sleep 5
          done
          exit 1

      - name: Deploy to Vercel (production)
        id: deploy
        run: |
          url=$(npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Post-deploy smoke (prod health check)
        run: curl -f "${{ steps.deploy.outputs.url }}/api/health" || exit 1
